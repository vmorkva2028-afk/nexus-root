name: Build NEXUS ROOT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NEXUS_ROOT_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: nexus-root-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="NEXUS_ROOT_SOURCE.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Missing $ARCHIVE in repository root"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          if ! unzip -t "$ARCHIVE"; then
            echo "::error::Source ZIP is damaged"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nexus-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/nexus-source"

          echo "Archive contents:"
          find "$RUNNER_TEMP/nexus-source" -maxdepth 3 -type f | head -200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/nexus-source"

          GRADLE_FILE="$(find "$ROOT" -name gradlew -type f | head -1 || true)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::gradlew not found in source archive"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          chmod +x "$GRADLE_FILE"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${{ steps.project.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            | head -1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/NEXUS-ROOT-debug.apk
          echo "path=release/NEXUS-ROOT-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ROOT-APK
          path: release/NEXUS-ROOT-debug.apk
          if-no-files-found: error
          retention-days: 14
