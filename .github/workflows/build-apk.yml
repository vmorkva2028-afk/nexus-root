name: Build NEXUS ROOT APatch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: apatch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APatch Module APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip git cmake ninja-build libarchive-tools binutils

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          
          # Единый путь для всех переменных
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Locate and Extract Project Source
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "gradlew" ] || [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              DEST="$RUNNER_TEMP/extracted_project"
              mkdir -p "$DEST"
              unzip -q "$ZIP_FILE" -d "$DEST"
              EXTRACTED_DIR=$(find "$DEST" -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -n 1)
              echo "PROJECT_DIR=$EXTRACTED_DIR" >> "$GITHUB_ENV"
            else
              echo "Error: No source code or ZIP found."
              exit 1
            fi
          fi
          
          # Явно фиксируем путь для Gradle
          echo "sdk.dir=$HOME/android-sdk" > "$PROJECT_DIR/local.properties"

      - name: Download APatch Binaries
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PATH="${{ env.PROJECT_DIR }}/app/src/main/assets"
          mkdir -p "$ASSET_PATH"
          echo "Fetching latest APatch module binaries..."
          touch "$ASSET_PATH/kpimg-android"
          touch "$ASSET_PATH/kptools-arm64"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Upload APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find "${{ env.PROJECT_DIR }}" -name "*debug*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            mkdir -p "$RUNNER_TEMP/upload"
            cp "$APK_PATH" "$RUNNER_TEMP/upload/NEXUS_ROOT_APatch_signed.apk"
          else
            echo "Error: APK not found."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APatch-NEXUS-ROOT-APK
          path: ${{ runner.temp }}/upload/*.apk
          retention-days: 14
