name: Build NEXUS ROOT with APatch tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NEXUS_ROOT_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: nexus-root-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXUS ROOT APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="NEXUS_ROOT_SOURCE.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::$ARCHIVE is missing at repository root"
            ls -la
            exit 1
          fi

          unzip -t "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/nexus-source"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/nexus-source"

          PROJECT_DIR="$RUNNER_TEMP/nexus-source"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/nexus-source" \
              -type f -name settings.gradle.kts \
              -printf '%h\n' | head -1)"
          fi

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android Gradle project structure is invalid"
            find "$RUNNER_TEMP/nexus-source" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          find "$PROJECT_DIR" -maxdepth 3 -type f

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            unzip \
            xz-utils \
            file

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install AArch64 toolchain
        shell: bash
        run: |
          set -euo pipefail

          VERSION="14.2.rel1"
          ARCHIVE="arm-gnu-toolchain-${VERSION}-x86_64-aarch64-none-elf.tar.xz"

          URL="https://developer.arm.com/-/media/Files/downloads/gnu/${VERSION}/binrel/${ARCHIVE}"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/$ARCHIVE"

          mkdir -p "$RUNNER_TEMP/arm-toolchain"

          tar -xJf "$RUNNER_TEMP/$ARCHIVE" \
            -C "$RUNNER_TEMP/arm-toolchain" \
            --strip-components=1

          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Build KernelPatch tools
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/bmax121/KernelPatch.git \
            "$RUNNER_TEMP/KernelPatch"

          export ANDROID=1

          make -C "$RUNNER_TEMP/KernelPatch/kernel" -j2

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          cmake \
            -S "$RUNNER_TEMP/KernelPatch/tools" \
            -B "$RUNNER_TEMP/KernelPatch/tools/build-android" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_ABI=arm64-v8a

          cmake --build \
            "$RUNNER_TEMP/KernelPatch/tools/build-android" \
            --parallel 2

          KPIMG="$(find "$RUNNER_TEMP/KernelPatch/kernel" \
            -type f \( -name kpimg -o -name kpimg-android \) \
            -size +4k | head -1 || true)"

          KPTOOLS="$(find "$RUNNER_TEMP/KernelPatch/tools/build-android" \
            -type f -name kptools -size +4k | head -1 || true)"

          if [ -z "$KPIMG" ] || [ -z "$KPTOOLS" ]; then
            echo "::error::KernelPatch tools were not produced"
            find "$RUNNER_TEMP/KernelPatch" -type f
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$PROJECT_DIR/app/src/main/assets"

          install -m 0755 "$KPTOOLS" \
            "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libkptools.so"

          install -m 0644 "$KPIMG" \
            "$PROJECT_DIR/app/src/main/assets/kpimg-android"

          test -s "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libkptools.so"
          test -s "$PROJECT_DIR/app/src/main/assets/kpimg-android"

          file \
            "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libkptools.so" \
            "$PROJECT_DIR/app/src/main/assets/kpimg-android"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/NEXUS-ROOT-ARM64.apk"

          ls -lh "$GITHUB_WORKSPACE/release/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ROOT-APatch-ARM64
          path: release/NEXUS-ROOT-ARM64.apk
          if-no-files-found: error
          retention-days: 14
