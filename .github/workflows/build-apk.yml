
name: Build NEXUS ROOT with real APatch tools

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS_ROOT_SOURCE(1).zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEXUS ROOT source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE='NEXUS_ROOT_SOURCE(1).zip'

          test -f "$SOURCE" || {
            echo "ERROR: $SOURCE not found"
            ls -la
            exit 1
          }

          unzip -tq "$SOURCE"

          mkdir -p "$RUNNER_TEMP/nexus-source"
          unzip -oq "$SOURCE" -d "$RUNNER_TEMP/nexus-source"

          SRC="$RUNNER_TEMP/nexus-source"

          test -d "$SRC/app"
          test -f "$SRC/settings.gradle.kts"
          test -f "$SRC/build.gradle.kts"

          cp -a "$SRC/app" "$GITHUB_WORKSPACE/"
          cp "$SRC/settings.gradle.kts" "$GITHUB_WORKSPACE/"
          cp "$SRC/build.gradle.kts" "$GITHUB_WORKSPACE/"
          cp "$SRC/gradle.properties" "$GITHUB_WORKSPACE/"

          echo "NEXUS ROOT source extracted."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            xz-utils \
            cmake \
            ninja-build \
            file

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install ARM64 bare-metal compiler
        shell: bash
        run: |
          set -euo pipefail

          VERSION=12.2.rel1
          ARCHIVE="arm-gnu-toolchain-${VERSION}-x86_64-aarch64-none-elf.tar.xz"

          URL="https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/${VERSION}/binrel/${ARCHIVE}"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/$ARCHIVE"

          mkdir -p "$RUNNER_TEMP/arm-toolchain"

          tar -xJf "$RUNNER_TEMP/$ARCHIVE" \
            -C "$RUNNER_TEMP/arm-toolchain" \
            --strip-components=1

      - name: Download KernelPatch
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/bmax121/KernelPatch.git \
            "$RUNNER_TEMP/KernelPatch"

      - name: Build kpimg-android
        shell: bash
        run: |
          set -euo pipefail

          KP="$RUNNER_TEMP/KernelPatch"

          export TARGET_COMPILE="$RUNNER_TEMP/arm-toolchain/bin/aarch64-none-elf-"
          export ANDROID=1

          cd "$KP/kernel"

          make -j2 hdr kpimg

          test -s kpimg

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"

          cp kpimg \
            "$GITHUB_WORKSPACE/app/src/main/assets/kpimg-android"

          echo "kpimg-android built successfully."

      - name: Build Android ARM64 kptools
        shell: bash
        run: |
          set -euo pipefail

          KP="$RUNNER_TEMP/KernelPatch"
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"

          cd "$KP/tools"

          mkdir -p build/android
          cd build/android

          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a \
            ../..

          cmake --build . --parallel 2

          test -s kptools

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" kptools

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          install -m 0755 kptools \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkptools.so"

          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkptools.so"

          echo "Android ARM64 kptools built successfully."

      - name: Verify APatch tools in application
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/kpimg-android
          test -s app/src/main/jniLibs/arm64-v8a/libkptools.so

          echo "Both APatch tools are present."
          ls -lh app/src/main/assets/kpimg-android
          ls -lh app/src/main/jniLibs/arm64-v8a/libkptools.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build NEXUS ROOT APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ROOT-APATCH-ARM64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
