name: Build NEXUS ROOT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!README.md'

permissions:
  contents: read

concurrency:
  group: nexus-root-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXUS ROOT ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # --- ДОБАВЛЯЕМ СБОРКУ KPTOOLS ---
      - name: Build and Inject kptools
        run: |
          git clone --depth 1 https://github.com/bmax121/KernelPatch.git kp_source
          cd kp_source/tools
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
          # Создаем папку в проекте и копируем бинарник
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
          cp kptools $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkptools.so
          chmod +x $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkptools.so
      # ---------------------------------

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in repository root"
            find . -maxdepth 3 -name gradlew -print
            exit 1
          fi
          chmod +x ./gradlew

      - name: Configure JVM 17 compatibility and Packaging
        shell: bash
        run: |
          set -euo pipefail
          
          # Добавляем useLegacyPackaging, чтобы libkptools.so извлекался
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/android {/a \    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }' app/build.gradle.kts
          elif [ -f "app/build.gradle" ]; then
             sed -i '/android {/a \    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }' app/build.gradle
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          files = [Path("app/build.gradle"), Path("app/build.gradle.kts")]
          found = False

          for path in files:
              if not path.exists(): continue
              found = True
              text = path.read_text()

              if path.name.endswith(".kts"):
                  java_block = "\ncompileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n}\n"
                  kotlin_block = "\nkotlinOptions {\n    jvmTarget = \"17\"\n}\n"
              else:
                  java_block = "\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n}\n"
                  kotlin_block = "\nkotlinOptions {\n    jvmTarget = '17'\n}\n"

              text = re.sub(r'compileOptions\s*\{[^{}]*\}', '', text)
              text = re.sub(r'kotlinOptions\s*\{[^{}]*\}', '', text)

              if "android {" not in text:
                  raise SystemExit(f"Android block not found in {path}")

              text = text.replace("android {", "android {" + java_block, 1)
              text += "\n" + kotlin_block
              path.write_text(text)
          PY

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ROOT-APK-ARM64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
