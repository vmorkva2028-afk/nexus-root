name: Build NEXUS ROOT BOOT PATCHER

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: nexus-root-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Validate project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          test -d app
          chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p release
          cp "$APK" release/NEXUS_ROOT.apk
          ls -lh release/NEXUS_ROOT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ROOT-APK
          path: release/NEXUS_ROOT.apk
          if-no-files-found: error
          retention-days: 14
